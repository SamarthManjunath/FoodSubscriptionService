<!DOCTYPE html>
<html xmlns:form="http://www.w3.org/1999/xhtml">

<head>
    <title>Enter food</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

<h1>Enter food </h1>
<div class="main">

    <form action="/addFood" method="post">
        <label for="name">
            Food:
        </label>
        <input type="text" id="name" name="name"
               placeholder="Enter item name" required>

        <div class="wrap">
            <button type="submit">
                Submit
            </button>
        </div>
    </form>
</div>
</body>

</html>
