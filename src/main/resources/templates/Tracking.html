<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Orders</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            background: #ffffff !important;
            color: #333 !important;
        }

        table {
            width: 90%;
            border-collapse: collapse;
            background: #ffffff;
            color: #333;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        th {
            background: #f0f0f0;
            color: #333;
            font-weight: bold;
            padding: 12px;
            border-bottom: 2px solid #ccc;
        }

        td {
            background: #ffffff;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .status {
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .status-pending { color: #856404; }
        .status-confirmed { color: #155724; }
        .status-preparing { color: #0c5460; }
        .status-delivered { color: #155724; }
        .status-cancelled { color: #721c24; }
    </style>
</head>
<body>

<h1>Tracking Page</h1>

<div th:if="${orders != null and !orders.empty}">
    <table>
        <thead>
        <tr>
            <th>Food Item 1</th>
            <th>Food Item 2</th>
            <th>Customer Name</th>
            <th>Date & Time</th>
            <th>Order Status</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.foodName1}">Food Item 1</td>
            <td th:text="${order.foodName2}">Food Item 2</td>
            <td th:text="${order.user.firstName + ' ' + order.user.lastName}">
                Customer Name
            </td>
            <td th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}">
                Date
            </td>
            <td>
                <span class="status"
                      th:classappend="' status-' + ${order.status.toString().toLowerCase()}"
                      th:text="${#strings.capitalize(#strings.toLowerCase(order.status.toString()))}">
                    Status
                </span>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div th:unless="${orders != null and !orders.empty}">
    <p>No orders found.</p>
</div>

</body>
</html>
