<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chef Dashboard</title>

    <!-- Keep external CSS -->
    <link rel="stylesheet" th:href="@{/style.css}" />

    <!-- Page-specific styles -->
    <style>
        body {
          margin: 0;
          min-height: 100vh;
          background: #fff;
          color: #333;
          font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;

          /* Center the card */
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
        }

        .chef-container {
          width: min(720px, 100%);
        }

        .card {
          background: #ffffff;
          border-radius: 16px;
          padding: 32px 28px;
          box-shadow: 0 10px 30px rgba(0,0,0,0.08);
          text-align: center;
        }

        .card h1 {
          margin: 0 0 24px;
          font-size: 28px;
          font-weight: 800;
        }

        .button-container {
          display: flex;
          justify-content: center;
          gap: 16px;
          flex-wrap: wrap;
        }

        .home-button {
          background-color: #2196F3;
          color: #fff;
          padding: 14px 22px;
          border-radius: 10px;
          text-decoration: none;
          font-weight: 700;
          transition: 0.2s ease;
          min-width: 170px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
        }

        .home-button:hover {
          background-color: #0b7dda;
          transform: translateY(-2px);
          box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
        }
    </style>
</head>

<body>
<main class="chef-container">
    <section class="card" aria-label="Chef Dashboard">
        <div class="main">
            <h1>👨‍🍳 Chef Dashboard</h1>

            <div class="button-container">
                <a href="../Chef-addFood.html" class="dashboard-button">➕ Add Food</a>
                <a href="/order" class="dashboard-button">📋 View Orders</a>
            </div>
        </div>
    </section>
</main>
</body>
</html>
