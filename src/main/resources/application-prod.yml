server:
  port: ${SERVER_PORT:5000}
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: food-subscription-app

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${RDS_HOSTNAME}:${RDS_PORT}/${RDS_DB_NAME}
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: true

management:
  endpoints:
    web:
      base-path: /details
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# Async task execution
spring.task:
  execution:
    thread-name-prefix: task-
    pool:
      core-size: 5
      max-size: 10
      queue-capacity: 25
  scheduling:
    thread-name-prefix: sched-

# Logging (prod-friendly)
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    com.java.foodSubscription: INFO